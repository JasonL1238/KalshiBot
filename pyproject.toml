[project]
name = "kalshibot"
version = "0.1.0"
description = "A research and trading system for Kalshi prediction markets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=7",
    "cryptography>=42",
    "duckdb>=1.1",
    "httpx>=0.27",
    "nautilus_trader==1.230.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    "vectorbt==1.0.0",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "sortedcontainers>=2.4"]

[project.scripts]
kalshibot = "kalshibot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshibot"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "data: needs local data under DATA_DIR/raw (auto-skipped when absent)",
    "slow: long-running simulation; skipped unless -m selects slow",
]
