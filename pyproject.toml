[project]
name = "kalshibot"
version = "0.1.0"
description = "A research and trading system for Kalshi prediction markets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=7",
    "cryptography>=42",
    "duckdb>=1.1",
    "httpx>=0.27",
    "nautilus_trader==1.230.0",
    # NumPy 2.5 deprecated timedelta's generic unit, which pandas 2.3 (vectorbt 1.0.0 needs
    # pandas < 3) uses for keyword and string Timedeltas. nautilus_trader (1.231.0 too) builds
    # them when its backtest engine is imported, so the kalshibot command breaks on the NumPy
    # release that makes this an error (2.7 at the earliest, per NEP 23). Cap numpy below that
    # release, or migrate to pandas 3 and vectorbt >= 1.1 (untested here), where
    # nautilus_trader doesn't warn.
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly<7",  # vectorbt 1.0.0's plot templates name scattermapbox, which plotly 7 dropped
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    "vectorbt==1.0.0",
    "websockets>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "sortedcontainers>=2.4"]
# The M4 execution benchmarks (benchmarks/AGENTS.md). Not needed to research or trade.
bench = [
    "aiohttp>=3.11",
    "h2>=4.1",  # httpx's HTTP/2, and the benchmarks' local order server
    "msgspec>=0.19",
    "orjson>=3.10",
    "picows>=2",
    # httpcore retries a failed `import sniffio` on every async request when it's missing,
    # which costs ~0.2 ms per request.
    "sniffio>=1.3",
    "uvloop>=0.21",
]

[project.scripts]
kalshibot = "kalshibot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshibot"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "data: needs local data under DATA_DIR/raw (auto-skipped when absent)",
    "slow: long-running simulation; skipped unless -m selects slow",
]
# A deprecation attributed to our own modules fails; one attributed to a dependency stays a
# warning (each regex matches the start of a module name). A warning raised in compiled code
# is attributed to its Python caller: under NumPy >= 2.5 (see the numpy requirement), pandas
# 2.3's pd.Timedelta(minutes=1) and pd.Timedelta("1min") warn from our line, so write
# pd.Timedelta(1, unit="min").
filterwarnings = [
    "error::DeprecationWarning:(kalshibot|test_|conftest)",
    "error::FutureWarning:(kalshibot|test_|conftest)",
]
